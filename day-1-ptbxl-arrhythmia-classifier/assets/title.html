<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px}
body{background:#f5f5f7;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#1d1d1f;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
h1{position:absolute;left:88px;top:120px;font-family:'Bricolage Grotesque','Inter',sans-serif;font-size:150px;line-height:.96;font-weight:700;letter-spacing:-.04em}
h1 span{color:#86868b}
.sub{position:absolute;left:88px;top:600px;font-size:32px;line-height:1.35;color:#515154;font-weight:500;letter-spacing:-.015em}
#s{position:absolute;left:0;top:760px;width:1080px;height:260px}
.stats{position:absolute;left:88px;right:88px;top:1060px;display:flex;border-top:1.5px solid #d2d2d7}
.stat{flex:1;padding-top:30px}
.stat+.stat{padding-left:32px;border-left:1.5px solid #d2d2d7}
.n{font-family:'Bricolage Grotesque','Inter',sans-serif;font-size:62px;font-weight:700;letter-spacing:-.03em;line-height:1}
.l{margin-top:12px;font-size:23px;font-weight:500;color:#6e6e73}
.foot{position:absolute;left:88px;right:88px;bottom:52px;display:flex;justify-content:space-between;font-size:22px;font-weight:500;color:#6e6e73}
</style></head><body>
<h1>PTB-XL<br>Arrhythmia<br><span>Classifier</span></h1>
<p class="sub">A neural network that learns to read a 12-lead ECG.</p>
<svg id="s" viewBox="0 0 1080 260" preserveAspectRatio="none"></svg>
<div class="stats">
  <div class="stat"><p class="n">21,799</p><p class="l">clinical ECGs</p></div>
  <div class="stat"><p class="n">12</p><p class="l">leads</p></div>
  <div class="stat"><p class="n">5</p><p class="l">diagnostic classes</p></div>
</div>
<div class="foot"><span>Project 1 of 5 &nbsp;·&nbsp; 1D ResNet, PyTorch</span><span>github.com/aryan9-6-5/MedTech-Suite</span></div>
<script>
// decorative synthetic ECG, not dataset data
const g=(t,m,s,a)=>a*Math.exp(-((t-m)**2)/(2*s*s));
const beat=(t,c)=>g(t,c-.2,.035,.14)-g(t,c-.045,.012,.16)+g(t,c,.012,1)-g(t,c+.04,.014,.28)+g(t,c+.24,.05,.26);
let d='';for(let i=0;i<=1600;i++){const t=i/1600*4.4;let v=0;[.45,1.45,2.45,3.45].forEach(c=>v+=beat(t,c));
 d+=(i?'L':'M')+(i/1600*1080).toFixed(1)+' '+(185-v*140).toFixed(1)}
document.getElementById('s').innerHTML=`<path d="${d}" fill="none" stroke="#ff2d55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
</script></body></html>
