<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px}
body{background:#f5f5f7;font-family:'Plus Jakarta Sans',sans-serif;color:#1d1d1f;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,85,.13),rgba(255,45,85,0) 65%);right:-300px;top:380px}
.wrap{position:absolute;inset:0;padding:96px 88px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6e6e73}
.dot{width:8px;height:8px;border-radius:50%;background:#ff2d55}
h1{margin-top:56px;font-size:132px;line-height:.98;font-weight:800;letter-spacing:-.045em}
h1 span{color:#86868b}
.sub{margin-top:36px;font-size:30px;line-height:1.35;color:#6e6e73;font-weight:500;letter-spacing:-.01em;max-width:900px}
.shell{position:absolute;left:88px;right:88px;top:760px;padding:10px;border-radius:44px;background:rgba(0,0,0,.035);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.core{border-radius:34px;background:#fff;height:250px;box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 30px 60px -20px rgba(0,0,0,.12);position:relative;overflow:hidden}
.core svg{position:absolute;inset:0}
.lead{position:absolute;left:32px;top:26px;font-size:15px;font-weight:700;letter-spacing:.16em;color:#a1a1a6}
.stats{position:absolute;left:88px;right:88px;top:1055px;display:flex;gap:20px}
.stat{flex:1;padding:8px;border-radius:36px;background:rgba(0,0,0,.035);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.stat div{border-radius:28px;background:#fff;padding:28px 30px;box-shadow:inset 0 1px 1px #fff,0 20px 40px -18px rgba(0,0,0,.12)}
.n{font-size:54px;font-weight:800;letter-spacing:-.04em}.l{margin-top:6px;font-size:18px;font-weight:500;color:#86868b}
.foot{position:absolute;left:88px;right:88px;bottom:52px;display:flex;justify-content:space-between;font-size:18px;font-weight:600;color:#86868b}
.foot b{color:#1d1d1f}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="pill"><i class="dot"></i>MedTech Series &nbsp;·&nbsp; 01 / 05</div>
  <h1>PTB-XL<br>Arrhythmia<br><span>Classifier.</span></h1>
  <p class="sub">A neural network that learns to read a 12-lead ECG.</p>
</div>
<div class="shell"><div class="core"><div class="lead">LEAD II</div>
<svg viewBox="0 0 904 250" preserveAspectRatio="none" id="s"></svg></div></div>
<div class="stats">
  <div class="stat"><div><p class="n">21,799</p><p class="l">clinical ECGs</p></div></div>
  <div class="stat"><div><p class="n">12</p><p class="l">leads</p></div></div>
  <div class="stat"><div><p class="n">5</p><p class="l">diagnostic classes</p></div></div>
</div>
<div class="foot"><span><b>Day 1</b> &nbsp;·&nbsp; 1D ResNet · PyTorch</span><span>github.com/aryan9-6-5/MedTech-Suite</span></div>
<script>
// decorative synthetic ECG, not dataset data
const g=(t,m,s,a)=>a*Math.exp(-((t-m)**2)/(2*s*s));
const beat=(t,c)=>g(t,c-.2,.035,.14)-g(t,c-.045,.012,.16)+g(t,c,.012,1)-g(t,c+.04,.014,.28)+g(t,c+.24,.05,.26);
let d='';for(let i=0;i<=1400;i++){const t=i/1400*3.7;let v=0;[.4,1.3,2.2,3.1].forEach(c=>v+=beat(t,c));
 d+=(i?'L':'M')+(i/1400*904).toFixed(1)+' '+(160-v*105).toFixed(1)}
document.getElementById('s').innerHTML=`<path d="${d}" fill="none" stroke="#ff2d55" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
</script></body></html>
